[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "st-bot"
version = "0.1.0"
description = "Telegram bot: photo in, cutout out. Persian UI, quotas, rate limits, stub payments"
requires-python = ">=3.11"
dependencies = [
    "st-common",
    "aiogram>=3.10",
    "httpx>=0.27",
    "redis>=5.0",
]

[tool.setuptools.packages.find]
include = ["st_bot*"]
