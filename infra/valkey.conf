# Valkey as a durable job queue. Survives restarts and power cuts with at most ~1 s of writes lost.
bind 0.0.0.0
protected-mode no
port 6379
dir /data

# Durability: append-only file fsynced every second, plus periodic snapshots.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 100
save 60 10000

# A queue must never silently drop data under memory pressure.
maxmemory-policy noeviction

# Recover even if the last AOF write was torn by a power cut.
aof-load-truncated yes
