[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "st-inference"
version = "0.1.0"
description = "Queue-backed GPU inference service: background removal and Persian listing generation"
requires-python = ">=3.11"
dependencies = [
    "st-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10",
    "opencv-python-headless>=4.9",
    "torch>=2.3",
    "torchvision>=0.18",
    "timm>=1.0.10",
    "einops>=0.8",
    "kornia>=0.7",
    "transformers>=4.44",
    "safetensors>=0.4",
    "huggingface_hub>=0.25",
    "nvidia-ml-py>=12",
    "psutil>=5.9",
]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "onnxruntime-gpu>=1.19", "onnxscript"]
inspyrenet = ["transparent-background==1.3.4"]

[tool.setuptools.packages.find]
include = ["st_inference*"]
