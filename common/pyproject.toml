[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "st-common"
version = "0.1.0"
description = "Shared utilities: Persian text normalization, config, logging, job queue, blob storage, licence guard"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "redis>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis>=2.23", "pytest-cov>=5"]

[tool.setuptools.packages.find]
include = ["st_common*"]
